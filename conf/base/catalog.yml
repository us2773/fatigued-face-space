# Here you can define all your datasets by using simple YAML syntax.
#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/catalog-data/introduction/#data-catalog

openface_result:
  type: partitions.PartitionedDataset
  path: data/02_intermediate/openface_result
  filename_suffix: ".parquet"
  dataset:
    type: pandas.ParquetDataset

cleansed_openface:
  type: partitions.PartitionedDataset
  path: data/03_primary/openface_result
  filename_suffix: ".parquet"
  dataset:
    type: pandas.ParquetDataset

metadata_list: 
  type: pandas.CSVDataset
  filepath: data/01_raw/metadata_csv/metadata_${globals:expt_name}.csv



trend_mean_table:
  type: pandas.ParquetDataset
  filepath: data/04_feature/trend_mean.parquet
  versioned: true

trend_var_table:
  type: pandas.ParquetDataset
  filepath: data/04_feature/trend_var.parquet
  versioned: true

peak_freq_table:
  type: pandas.ParquetDataset
  filepath: data/04_feature/peak_freq.parquet
  versioned: true

integrated_feature:
  type: pandas.ParquetDataset
  filepath: data/04_feature/integrated_feature.parquet
  versioned: true

features_table: 
  type: pandas.CSVDataset
  filepath: data/05_reporting/features_table.csv
  versioned: true
  save_args:
    lineterminator: "\n"