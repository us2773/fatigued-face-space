# execute_openface関連
openface: 
  input_dir: data/01_raw/movie
  temporary_dir: data/02_intermediate/openface_temporary
  result_dir: data/02_intermediate/openface_result
  input_ext: /*mp4
  temporary_ext: /*csv
  result_ext: /*parquet
  metadata_dir: data/02_intermediate/metadata_csv
  au_model: static

# trend, residual分離関連
trend:
  frac: 0.1
  it: 3
  delta: 0.0
  return_sorted: false

# peak点検出関連
peak:
  height: 0.1
  distance: 5
  prominence: 0.1
  mad_multiplier: 3.0
  min_prominence: 0.1
  max_width_seconds: None
  min_distance_seconds: None

# Docker関連
# サンプル
# ここはGit追跡対象のconf/baseです。ここには環境設定を記載せず、非追跡ディレクトリのparameter.ymlに自分の環境のものに変更してください。
docker:
  docker_id: your_docker_container_id
  docker_workdir: /home/openface-build
  docker_processed_dir: /home/openface-build/processed
  feature_extraction: /home/openface-build/build/bin/FeatureExtraction
  container_name: your_container_name